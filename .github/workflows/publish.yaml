name: Publish to VS Code Marketplace

# Publishes the extension to the Visual Studio Marketplace using OIDC trusted
# publishing — no long-lived PAT is stored in this repository.
#
# The policy on the publisher's "Trusted Publishing" page must match this run
# exactly: repository owner akashmahlaz, repository Threads, workflow
# publish.yaml, environment Production. See https://aka.ms/vsm/trustedpublishing

on:
  push:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - .github/workflows/publish.yaml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    # The Marketplace credential expires after 15 minutes and each GitHub
    # OIDC token can be exchanged only once, so this job does one thing.
    permissions:
      contents: read
      id-token: write # required to request the OIDC token
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run compile

      - name: Verify the version matches the tag
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json version ($PKG) does not match tag ($TAG)"
            exit 1
          fi

      - name: Report the identity this run presents to the Marketplace
        # The Trusted Publishing policy must match these values exactly. If the
        # token exchange fails, compare this output against the policy.
        run: |
          echo "repository_owner = ${{ github.repository_owner }}"
          echo "repository      = ${{ github.event.repository.name }}"
          echo "workflow        = $(basename "$GITHUB_WORKFLOW_REF" | sed 's/@.*//')"
          echo "ref             = $GITHUB_WORKFLOW_REF"
          echo "environment     = ${{ github.environment }}"
          echo "event           = ${{ github.event_name }}"
          echo "publisher       = $(node -p "require('./package.json').publisher")"

      - name: Refuse to republish a version that is already live
        run: |
          PKG=$(node -p "require('./package.json').version")
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://marketplace.visualstudio.com/items?itemName=akashdeepsingh.threads")
          if [ "$CODE" = "200" ]; then
            LIVE=$(curl -s \
              "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json;api-version=7.2-preview.1" \
              -d '{"filters":[{"criteria":[{"filterType":7,"value":"akashdeepsingh.threads"}]}],"flags":914}' \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).results[0].extensions[0].versions[0].version)}catch{console.log('')}})")
            if [ "$LIVE" = "$PKG" ]; then
              echo "::error::version $PKG is already published. Bump package.json before publishing."
              exit 1
            fi
            echo "Live version is $LIVE; publishing $PKG."
          else
            echo "Nothing published yet; publishing $PKG."
          fi

      - name: Publish
        run: npx @vscode/vsce publish --oidc