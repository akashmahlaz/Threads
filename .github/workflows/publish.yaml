name: Publish to VS Code Marketplace

# Publishes the extension to the Visual Studio Marketplace using OIDC trusted
# publishing — no long-lived PAT is stored in this repository.
#
# The policy on the publisher's "Trusted Publishing" page must match this run
# exactly: repository owner akashmahlaz, repository Threads, workflow
# publish.yaml, environment Production. See https://aka.ms/vsm/trustedpublishing
#
# Publishing happens on a push to main that touches the extension, on a
# published release, or on demand. Bump the version in
# vscode-extension/package.json before pushing; the workflow refuses to
# republish a version that is already live.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A push that only touches docs or this workflow has nothing to publish.
  # Decide that here so the publish job can skip instead of failing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the extension change?
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "extension=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "extension=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" || true)
          if echo "$CHANGED" | grep -q '^vscode-extension/'; then
            echo "extension=true" >> "$GITHUB_OUTPUT"
          else
            echo "extension=false" >> "$GITHUB_OUTPUT"
            echo "Only docs or workflow files changed; nothing to publish."
          fi

  publish:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    environment: Production
    # The Marketplace credential expires after 15 minutes and each GitHub
    # OIDC token can be exchanged only once, so this job does one thing.
    permissions:
      contents: read
      id-token: write # required to request the OIDC token
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run compile

      - name: Verify the version matches the tag
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json version ($PKG) does not match tag ($TAG)"
            exit 1
          fi

      - name: Report the identity this run presents to the Marketplace
        # The Trusted Publishing policy must match these values exactly. If the
        # token exchange fails, compare this output against the policy.
        run: |
          echo "repository_owner = ${{ github.repository_owner }}"
          echo "repository      = ${{ github.event.repository.name }}"
          echo "workflow        = $(basename "$GITHUB_WORKFLOW_REF" | sed 's/@.*//')"
          echo "ref             = $GITHUB_WORKFLOW_REF"
          echo "environment     = ${{ github.environment }}"
          echo "event           = ${{ github.event_name }}"
          echo "publisher       = $(node -p "require('./package.json').publisher")"
          echo "version         = $(node -p "require('./package.json').version")"

      - name: Refuse to republish a version that is already live
        run: |
          PKG=$(node -p "require('./package.json').version")
          LIVE=$(curl -s \
            "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json;api-version=7.2-preview.1" \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"akashdeepsingh.threads"}]}],"flags":914}' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).results[0].extensions[0].versions[0].version)}catch{console.log('')}})")
          if [ "$LIVE" = "$PKG" ]; then
            echo "::error::version $PKG is already published. Bump package.json before pushing."
            exit 1
          fi
          echo "Live version is ${LIVE:-none}; publishing $PKG."

      - name: Publish
        run: npx @vscode/vsce publish --oidc